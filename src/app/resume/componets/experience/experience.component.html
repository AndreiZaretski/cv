<h2>{{experience?.title}}</h2>

@for (experience of experience?.organization; track $index) {
<div class="experience-component">
  <h2>
    {{experience.name}}
  </h2>
  <h3>
    {{experience.position}}
</h3>

  <p>
    {{experience.dates}}
  </p>

  <p class="experience-description">
    {{experience.description}}
  </p>
  
</div>
}
